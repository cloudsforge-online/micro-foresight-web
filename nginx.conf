# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. A "page not found" screen delivered as a success is indexed by
# search engines, called healthy by uptime checks, passed by link checkers — and a deploy that
# drops a route then looks exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and the route table in src/app.tsx must agree. That is one line per
# top-level route, paid once per route, in exchange for an honest status code on every wrong URL.
# test/routes.test.ts reads this file and fails the build when they drift.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it —
# a conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# environment rather than a surface: `surfaces.ts` reserves them so that no surface may take one
# as a subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# A testnet estate carries test EMBER, a faucet and deliberately broken markets. Every page of it
# competing with the real one in a search index is a support problem before it is an SEO problem —
# and here it is worse than on the marketing site, because the pages in question are markets that
# look exactly like markets a stranger could stake real money in. So a non-mainnet environment
# answers `Disallow: /` and serves no sitemap.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`foresight-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this
# surface at the two-label `foresight.testnet.<apex>` — unreachable, because Cloudflare's Universal
# SSL is a one-label wildcard and every two-label name fails the handshake at the edge).
# `surfaces.ts` keeps the old shape deliberately, so both have to match or half the estate stays
# indexable on testnet.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh. A market page
    # is a link people paste at each other; it has to work when it is opened cold.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self. This page asks a wallet to sign a transaction that moves
    # somebody's EMBER, and a signing prompt reached through somebody else's iframe is the
    # clickjacking surface that flow exists inside.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # REPEATED, for the reason the `= /index.html` block below already records: a location that
        # declares any `add_header` inherits NONE from the level above. This block declared
        # Cache-Control and therefore shipped the whole JavaScript bundle with no nosniff, no
        # frame-options and no referrer-policy — the same defect that block was fixed for, in the
        # location that serves the code.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        # REPEATED, because `error_page 404 /index.html` IS an internal redirect — unlike
        # `try_files`, it re-enters this block. So an honest 404, the thing this whole config
        # exists to preserve, was served with Cache-Control and NOTHING ELSE: no nosniff, no
        # frame-options, no referrer-policy. Third instance of the same nginx rule in this file —
        # add_header does not accumulate, and a location declaring any inherits none.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts, which the router and the navigation both
    # derive from. test/routes.test.ts checks all three against each other.
    #
    # ══════════════════════════════════════════════════════════════════════════════════════════
    # THE SHELL IS NOT CACHEABLE, AND UNDER /markets IT ALSO VARIES ON `Accept`. (micro-org#234)
    #
    # `try_files` does NOT re-enter `location = /index.html` — only the `error_page` redirect at
    # the foot of this file does, which is what the note in that block is about. So every address
    # below was served the shell with NONE of that block's headers. Measured on 2026-08-09 inside
    # the running container, so that nothing at the edge is in the way:
    #
    #     GET /markets/<uuid>  →  200, Content-Type: text/html, ETag, Last-Modified,
    #                             no Cache-Control, no Vary
    #     GET /                →  the same, and for the same reason
    #     GET /index.html      →  Cache-Control: no-store   (the one block that declared it)
    #
    # That is two independent defects in one answer.
    #
    # ── 1. A SHELL WITH AN ETAG AND NO Cache-Control IS HEURISTICALLY CACHEABLE ────────────────
    #
    # It is the file that names the current asset hashes, which is exactly why the block above is
    # `no-store`. Serving the SAME file under a different address without that header leaves the
    # stale-deploy trap open at every address a person actually visits.
    #
    # ── 2. `/markets` IS TWO RESOURCES AT ONE ADDRESS, SPLIT ON `Accept` ──────────────────────
    #
    # The gateway routes `/markets` on this host to micro-foresight when the request says
    # `Accept: application/json`, and here otherwise (`cf-api-foresight-markets` in
    # deploy/gateway/dynamic/estate-web.yml). So a browser NAVIGATION to /markets/<uuid> gets this
    # shell and the bundle's own fetch for the same address gets the market as JSON.
    #
    # A response whose body depends on a request header has to name that header in `Vary`, or a
    # cache keyed without it serves one branch's body to the other branch's request. That is what
    # was happening: the navigation stored a text/html entry, the bundle's fetch matched it, and
    # the page sat on "Loading the market" for ever. Every shared link, reload and bookmark into a
    # market was broken; entering from the list worked, because that address had not been
    # navigated to.
    #
    # THE GATEWAY APPENDS TO THIS RATHER THAN REPLACING IT, so the header survives to the browser
    # as `Vary: Accept,Origin`: traefik's CORS `addVaryHeader` reads the response's existing Vary
    # and only adds `Origin` to it (traefik v3.2.3, pkg/middlewares/headers/header.go — the
    # version the estate runs). The estate answered `vary: Origin` alone because nothing here had
    # ever sent one, not because the gateway had overwritten it.
    #
    # ── WHY `Vary: Accept` IS NOT ON THE OTHER TWO BLOCKS ─────────────────────────────────────
    #
    # `/`, `/portfolio` and `/rules` are served by this container whatever the request asks for —
    # no router in the gateway negotiates them. Declaring a variance a response does not have is a
    # false statement about a cache key, and it is the kind that never fails visibly. `no-store`
    # belongs on all of them; `Vary: Accept` belongs only where a second answer exists.
    # ══════════════════════════════════════════════════════════════════════════════════════════

    location = / {
        try_files /index.html =404;
        # REPEATED. Fourth instance of the same nginx rule in this file: add_header does not
        # accumulate, and a location declaring any inherits none from the level above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # `markets` owns everything beneath it: /markets/<uuid> is one market, and it is the address
    # people paste at each other. It is also the one client route the gateway negotiates.
    location ~ ^/markets(/|$) {
        try_files /index.html =404;
        add_header Vary "Accept" always;
        # REPEATED, for the reason above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # `portfolio` owns everything beneath it too: /portfolio/<address> is one staker's positions.
    location ~ ^/(portfolio|rules)(/|$) {
        try_files /index.html =404;
        # REPEATED, for the reason above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from the apex (test/no-build-time-config.test.ts).
    # nginx is the component that knows: it has `$host` on every request, so the addresses are
    # composed per request and the artefact stays environment-free.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ──────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `foresight.<apex>`, so the same generator would emit
    # `network.foresight.<apex>` — a two-label hostname that resolves to nothing and fails the
    # edge's one-label wildcard certificate. A sitemap of addresses that cannot be connected to is
    # worse than no sitemap: a crawler handed dead URLs by a site's own index discounts the ones
    # that work.
    #
    # So this surface lists ITS OWN public routes and nothing else, and the estate sitemap stays
    # the apex's job. `test/sitemap.test.ts` checks both halves — every `<loc>` composed from
    # `$scheme://$host`, and every route the navigation offers present.
    #
    # /markets/<uuid> IS DELIBERATELY ABSENT. It is unbounded — one address per market, minted by
    # the service — and a static list of them here would be a second opinion about which markets
    # exist that goes stale the moment one is created. They are reachable from `/`, which is what a
    # crawler follows.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://$host/portfolio</loc></url>
  <url><loc>$scheme://$host/rules</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, robots.txt) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
