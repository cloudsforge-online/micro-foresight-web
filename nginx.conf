# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. A "page not found" screen delivered as a success is indexed by
# search engines, called healthy by uptime checks, passed by link checkers — and a deploy that
# drops a route then looks exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and the route table in src/app.tsx must agree. That is one line per
# top-level route, paid once per route, in exchange for an honest status code on every wrong URL.
# test/routes.test.ts reads this file and fails the build when they drift.

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh. A market page
    # is a link people paste at each other; it has to work when it is opened cold.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self. This page asks a wallet to sign a transaction that moves
    # somebody's EMBER, and a signing prompt reached through somebody else's iframe is the
    # clickjacking surface that flow exists inside.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts, which the router and the navigation both
    # derive from. test/routes.test.ts checks all three against each other.
    location = / {
        try_files /index.html =404;
    }

    # `markets` and `portfolio` own everything beneath them: /markets/<uuid> is one market and
    # /portfolio/<address> is one staker's positions. Both are addresses people share.
    location ~ ^/(markets|portfolio|rules)(/|$) {
        try_files /index.html =404;
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, robots.txt) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
