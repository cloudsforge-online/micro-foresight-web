<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default and then changes
  colour.

  data-cf-scheme is the third of the three, added with @cloudsforge/ui 1.1. `auto` follows the
  reader's operating system; `light` and `dark` force one. It is set here, statically, for the same
  reason the other two are — a theme flash is worse than a theme nobody asked for.

  This surface never carried a light mode of its own, so there is nothing here to delete: `auto` is
  the first time a reader in a light environment is served rather than made to fight the page, and
  the contrast of every pair is measured in the design system on both schemes rather than on the
  one this repository happened to check.

  `warm` is the house substrate. The cool one exists for products about measurement; a market a
  stranger is asked to stake money in is not one.
-->
<html lang="en-GB" data-cf-product="foresight" data-cf-substrate="warm" data-cf-scheme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      `color-scheme`, spelled the way the standard spells it. This was `colour-scheme` — British,
      correct English, and INERT: no browser has ever read it, so the declaration that was supposed
      to tell the browser which form controls and scrollbars to draw did nothing at all, and the
      inputs on the stake panel were drawn light on a dark page in every browser that honours it.

      Both schemes are declared rather than only `dark`, because `data-cf-scheme="auto"` above means
      the token layer now resolves whichever palette the reader's system asks for. Declaring only
      `dark` here would leave the chrome the browser draws disagreeing with the page around it.
    -->
    <meta name="color-scheme" content="dark light" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />
    <!--
      THE GOOGLE ANALYTICS MEASUREMENT ID, AND NOT THE GOOGLE ANALYTICS TAG.
      ────────────────────────────────────────────────────────────────────────────────────────
      There is deliberately no third-party analytics `<script src=…>` anywhere in this file, and
      there must never be one — the tag's own domain is not even spelled out here, so that a grep
      for it over this file returns nothing at all and the absence is checkable rather than
      asserted. The stock snippet fetches that script and sets
      `_ga` on load — before any banner has been drawn, let alone answered — and under ePrivacy
      Art. 5(3) an analytics cookie set before consent is a violation that a banner underneath it
      does not cure. This estate is separately under GDPR review and this surface custodies
      stakes, which makes "we will tidy the analytics later" the wrong order to do things in.
      `@cloudsforge/ui/consent` injects the tag from exactly one place: the Accept button in
      `CookieBanner`. See the header of that module for the whole argument.

      It is a meta tag rather than a build-time environment variable because
      test/no-build-time-config.test.ts greps for those and fails the build — an artefact with an
      environment frozen into it is not the artefact that passed CI. (That test greps this file
      too, which is why the prefix is not spelled out here.) This is the same mechanism
      `cf-release` above already uses, and the ID is an identity rather than a configuration: it
      names the property, it does not tell the bundle where it is running. An absent or empty
      value means analytics is simply off, which is what a local `pnpm dev` gets.
    -->
    <meta name="cf-analytics" content="G-ZFBLKK519K" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />


    <title>Forge Foresight</title>
    <meta
      name="description"
      content="Prediction markets on Hearth. Parimutuel, settled by the contract, with every market's sources and resolution criteria published before you stake."
    />
    <!--
      ONE og block. There were two: og:type, og:title and og:description were each declared twice,
      and twitter:card was declared as both `summary` and `summary_large_image`. The later
      declaration wins in every crawler, so the first block's longer description — the one that
      names what makes this market honest — was dead text that no share card ever showed.

      The image path is relative, deliberately: the same bundle is served from localhost, a preview
      host and the apex, and this file may name no hostname. Crawlers that want an absolute URL
      resolve it against the page they fetched. `summary_large_image` is the correct card type
      precisely because og:image is present.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forge Foresight" />
    <meta
      property="og:description"
      content="Prediction markets on Hearth. Parimutuel, settled by the contract, with every market's sources and resolution criteria published before you stake."
    />
    <!--
      ── THE MOUNT IS IN THIS BY HAND ────────────────────────────────────────────────────────────
      vite rewrites `src` and `href` against `base` and does NOT touch `content`, so a
      root-relative card survives the build and resolves to MICRO-SITE's on the apex. It never
      404s, which is why the same line went unnoticed on seven surfaces until 2026-08-20.
    -->
    <meta property="og:image" content="/foresight/og-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
