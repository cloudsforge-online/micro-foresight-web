<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default and then changes
  colour.

  ── WHY THE PRODUCT KEY IS WRITTEN TWICE ─────────────────────────────────────────────────────

  `data-cf-product` is the documented attribute — tokens.css:140 says so, and all twelve other
  product selectors in that file are `[data-cf-product='…']`. Foresight's is not: tokens.css:332
  reads `[data-product='foresight']`, without the `cf-`. So the selector carrying this product's
  accent (#1e89c7) matches nothing, and the page silently falls back to the company ember.

  micro-ui is single-owner, so this repository REPORTS that rather than editing it, and carries
  BOTH spellings here — which costs one attribute, introduces no copy of a brand colour into this
  repo, and renders correctly against the broken stylesheet and the fixed one alike.
  test/registry.test.ts fails the day tokens.css is corrected, so `data-product` is deleted then
  rather than left behind.

  (tokens.css:363 already documents this exact failure happening once before, with
  data-cf-product="admin" against a selector that did not exist.)
-->
<html lang="en-GB" data-cf-product="foresight" data-product="foresight" data-cf-substrate="warm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="colour-scheme" content="dark" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />

    <title>Forge Foresight</title>
    <meta
      name="description"
      content="Prediction markets on Hearth. Parimutuel, settled by the contract, with every market's sources and resolution criteria published before you stake."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forge Foresight" />
    <meta
      property="og:description"
      content="Prediction markets on Hearth. Parimutuel, settled by the contract, with every market's sources and resolution criteria published before you stake."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
